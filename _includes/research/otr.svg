<svg class="rfig" viewBox="0 0 480 300" role="img" aria-label="A decision tree that routes a student to one of three course sequences, with the recommended path highlighted" xmlns="http://www.w3.org/2000/svg">
  <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" opacity="0.55">
