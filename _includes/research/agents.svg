  </g>
  <g fill="none" stroke="currentColor" stroke-width="1.8">
    <rect x="34" y="62" width="68" height="38" rx="5"/>
    <rect x="130" y="62" width="68" height="38" rx="5"/>
    <rect x="226" y="62" width="68" height="38" rx="5"/>
    <rect x="130" y="176" width="68" height="38" rx="5"/>
    <rect x="226" y="176" width="68" height="38" rx="5"/>
  </g>
