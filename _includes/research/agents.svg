  </g>
  <rect class="rfig-accent-fill" x="316" y="56" width="92" height="50" rx="5" opacity="0.12"/>
  <g font-family="inherit" font-size="10" fill="currentColor" text-anchor="middle">
    <text x="68" y="79">problem</text>
    <text x="68" y="92">formulator</text>
    <text x="164" y="79">data</text>
    <text x="164" y="92">engineer</text>
    <text x="260" y="85">analyst</text>
    <text x="164" y="199">outline</text>
    <text x="260" y="199">writer</text>
  </g>
  <g font-family="inherit" text-anchor="middle">
    <text x="362" y="78" font-size="10.5" class="rfig-accent-text">gatekeeper</text>
