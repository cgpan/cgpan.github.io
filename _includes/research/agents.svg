<svg class="rfig" viewBox="0 0 480 300" role="img" aria-label="The EDM-ARS pipeline: a problem formulator, data engineer and analyst feed a gatekeeper that returns pass, revise or abort; on pass an outline agent and a writer produce the manuscript, and on revise the work is sent back to an earlier agent" xmlns="http://www.w3.org/2000/svg">
