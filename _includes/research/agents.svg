    <text x="356" y="242">manuscript</text>
    <text x="250" y="134" font-size="9.5" opacity="0.7">pass</text>
  </g>
  <g class="rfig-accent" fill="none" stroke-width="1.6" stroke-dasharray="4 4">
    <path d="M328 106 V122 H68 V100"/>
  </g>
  <path class="rfig-accent" fill="none" stroke-width="1.6" d="M62 106 l6 -8 l6 8"/>
  <text x="150" y="116" font-family="inherit" font-size="9.5" class="rfig-accent-text">revise</text>
  <g font-family="inherit" font-size="11" fill="currentColor" opacity="0.62">
